name: docker-build

# Build-only check: the image must compile on every push, but nothing is
# published. Publishing to a registry needs DOCKERHUB_USERNAME / DOCKERHUB_TOKEN
# and a deliberate decision to support a second distribution channel again —
# v7 ships through PyPI.

on:
  push:
    branches: [main]
    paths:
      - "Dockerfile"
      - ".dockerignore"
      - "docker-compose.yml"
      - "requirements.txt"
      - "pyproject.toml"
      - "src/**"
      - ".github/workflows/docker-build.yml"
  pull_request:
    branches: [main]
    paths:
      - "Dockerfile"
      - "requirements.txt"
      - "src/**"

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Build the image (no push)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: vishap-analyzer:ci

      - name: Smoke-test the container
        run: |
          docker run -d --name vishap-ci -e VISHAP_DEV=true -p 5001:5001 vishap-analyzer:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5001/health; then
              echo "health ok"
              exit 0
            fi
            sleep 2
          done
          docker logs vishap-ci
          exit 1
